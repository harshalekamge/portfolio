<!DOCTYPE html>

    <!-- Basic Meta -->

    <meta name="theme-color" content="#000000" />

    <meta name="language" content="en" />

    <!-- Title -->
    <title>

    <!-- Primary SEO Description -->

      name="description"
      content="Portfolio of Harsha Lekamge, Software Engineer, Web Developer, and Data Scientist from Sri Lanka. View projects, technical skills, professional experience, and contact details."
    />

    <!-- Keywords (Light Usage) -->
    <meta
      name="keywords"
      content="Harsha Lekamge, Software Engineer Sri Lanka, Data Scientist Sri Lanka, Web Developer, Portfolio, React Developer, Node.js Developer, Full Stack Developer"
    />

    <!-- Robots -->
    <meta
      name="robots"
      content="index, follow, max-snippet:-1, max-image-preview:large"
    />

    <!-- Favicons -->
    <link
      rel="icon"
      href="%PUBLIC_URL%/favicon.ico"
      sizes="16x16 32x32 48x48"
    />

      rel="apple-touch-icon"
      href="%PUBLIC_URL%/apple-touch-icon.png"
    />
    <link rel="manifest" href="%PUBLIC_URL%/site.webmanifest" />

    <!-- Performance: Preconnect & DNS Prefetch -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="dns-prefetch" href="//fonts.googleapis.com" />
    <link rel="dns-prefetch" href="//fonts.gstatic.com" />

    <meta
      property="og:title"
      content="Harsha Lekamge – Software Engineer & Data Scientist"
    />

      content="Official portfolio of Harsha Lekamge showcasing software projects, data science work, and professional experience."
